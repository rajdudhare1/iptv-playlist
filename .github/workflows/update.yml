name: Sync IPTV Playlist

on:
  schedule:
    - cron: "0 2 * * *" # Runs automatically every day at 7:30 AM IST
  workflow_dispatch:    # Lets you trigger a manual update anytime with one tap

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate updated playlist.m3u
        run: python build_playlist.py

      - name: Commit updated playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          git diff --cached --quiet || git commit -m "Auto-update IPTV playlist from iptv-org"
          git push
